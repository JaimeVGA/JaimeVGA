<svg width="560" height="210" viewBox="0 0 560 210" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style><![CDATA[
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #00d9a6;
    }
    .pill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #9fa8da;
      letter-spacing: 0.4px;
    }
    .bar-label {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #e6edf3;
    }
    .bar-pct {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      fill: #9fa8da;
    }
    .nn-caption {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      fill: #6e7b99;
    }
    .bar-fill {
      transform-box: fill-box;
      transform-origin: left center;
      animation: growBar 1.1s cubic-bezier(0.22, 1, 0.36, 1) both, shimmerBar 3.6s ease-in-out infinite;
    }
    .b1 { animation-delay: 0.10s, 1.20s; }
    .b2 { animation-delay: 0.25s, 1.45s; }
    .b3 { animation-delay: 0.40s, 1.70s; }
    .b4 { animation-delay: 0.55s, 1.95s; }
    @keyframes growBar {
      from { transform: scaleX(0); opacity: 0.35; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    @keyframes shimmerBar {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.78; }
    }
  ]]></style>

  <defs>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9a6" stop-opacity="0" />
      <stop offset="45%" stop-color="#00d9a6" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="nnGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#00d9a6" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#131a27" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="558" height="208" rx="12" />
    </clipPath>
    <clipPath id="nnClip">
      <rect x="345" y="54" width="190" height="140" rx="10" />
    </clipPath>
  </defs>

  <!-- Card Container -->
  <rect x="1" y="1" width="558" height="208" rx="12" fill="#0f141e" stroke="#263042" stroke-width="1.5" />

  <!-- Top-Edge Sheen -->
  <g clip-path="url(#cardClip)">
    <rect x="-180" y="1" width="180" height="2" fill="url(#sheenGrad)">
      <animate attributeName="x" values="-180;560;-180" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Header Row -->
  <text x="24" y="34" class="title">ML &amp; Engineering Focus</text>

  <rect x="404" y="19" width="131" height="22" rx="11" fill="#131c2b" stroke="#223047" stroke-width="1" />
  <circle cx="418" cy="30" r="3" fill="none" stroke="#00d9a6" stroke-width="1.2">
    <animate attributeName="r" values="3;7.5" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;0" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="418" cy="30" r="3" fill="#00d9a6">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="429" y="33.5" class="pill-text">ACTIVE · MEXICO</text>

  <!-- Left Column: Animated Focus Bars -->
  <text x="24" y="64" class="bar-label">Data Analysis &amp; Pandas</text>
  <text x="310" y="64" text-anchor="end" class="bar-pct">92%</text>
  <rect x="24" y="71" width="286" height="8" rx="4" fill="#1b2333" />
  <rect x="24" y="71" width="263" height="8" rx="4" fill="url(#barGrad)" class="bar-fill b1" />

  <text x="24" y="98" class="bar-label">Machine Learning &amp; TensorFlow</text>
  <text x="310" y="98" text-anchor="end" class="bar-pct">88%</text>
  <rect x="24" y="105" width="286" height="8" rx="4" fill="#1b2333" />
  <rect x="24" y="105" width="252" height="8" rx="4" fill="url(#barGrad)" class="bar-fill b2" />

  <text x="24" y="132" class="bar-label">Python, C &amp; Backend</text>
  <text x="310" y="132" text-anchor="end" class="bar-pct">85%</text>
  <rect x="24" y="139" width="286" height="8" rx="4" fill="#1b2333" />
  <rect x="24" y="139" width="243" height="8" rx="4" fill="url(#barGrad)" class="bar-fill b3" />

  <text x="24" y="166" class="bar-label">Cloud, Docker &amp; Databases</text>
  <text x="310" y="166" text-anchor="end" class="bar-pct">80%</text>
  <rect x="24" y="173" width="286" height="8" rx="4" fill="#1b2333" />
  <rect x="24" y="173" width="229" height="8" rx="4" fill="url(#barGrad)" class="bar-fill b4" />

  <!-- Right Column: Animated Neural Network Visualization -->
  <rect x="345" y="54" width="190" height="140" rx="10" fill="#131a27" stroke="#1f2a3d" stroke-width="1" />

  <g clip-path="url(#nnClip)">
    <!-- Subtle Grid & Radial Glow -->
    <g stroke="#1f2a3d" stroke-width="0.6" opacity="0.65">
      <line x1="369" y1="54" x2="369" y2="194" />
      <line x1="393" y1="54" x2="393" y2="194" />
      <line x1="417" y1="54" x2="417" y2="194" />
      <line x1="441" y1="54" x2="441" y2="194" />
      <line x1="465" y1="54" x2="465" y2="194" />
      <line x1="489" y1="54" x2="489" y2="194" />
      <line x1="513" y1="54" x2="513" y2="194" />
      <line x1="345" y1="78" x2="535" y2="78" />
      <line x1="345" y1="102" x2="535" y2="102" />
      <line x1="345" y1="126" x2="535" y2="126" />
      <line x1="345" y1="150" x2="535" y2="150" />
      <line x1="345" y1="174" x2="535" y2="174" />
    </g>
    <circle cx="440" cy="118" r="76" fill="url(#nnGlow)" />

    <!-- Neural Connections (Input -> Hidden) -->
    <g stroke="#263042" stroke-width="1" opacity="0.75">
      <line x1="374" y1="84"  x2="440" y2="74" />
      <line x1="374" y1="84"  x2="440" y2="103" />
      <line x1="374" y1="84"  x2="440" y2="132" />
      <line x1="374" y1="84"  x2="440" y2="161" />
      <line x1="374" y1="118" x2="440" y2="74" />
      <line x1="374" y1="118" x2="440" y2="103" />
      <line x1="374" y1="118" x2="440" y2="132" />
      <line x1="374" y1="118" x2="440" y2="161" />
      <line x1="374" y1="152" x2="440" y2="74" />
      <line x1="374" y1="152" x2="440" y2="103" />
      <line x1="374" y1="152" x2="440" y2="132" />
      <line x1="374" y1="152" x2="440" y2="161" />
      <!-- Hidden -> Output -->
      <line x1="440" y1="74"  x2="506" y2="98" />
      <line x1="440" y1="74"  x2="506" y2="138" />
      <line x1="440" y1="103" x2="506" y2="98" />
      <line x1="440" y1="103" x2="506" y2="138" />
      <line x1="440" y1="132" x2="506" y2="98" />
      <line x1="440" y1="132" x2="506" y2="138" />
      <line x1="440" y1="161" x2="506" y2="98" />
      <line x1="440" y1="161" x2="506" y2="138" />
    </g>

    <!-- Active Signal Paths -->
    <path id="sig1" d="M374,84 L440,103 L506,98" stroke="#00d9a6" stroke-width="1.2" stroke-opacity="0.35" fill="none" />
    <path id="sig2" d="M374,118 L440,74 L506,98" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.30" fill="none" />
    <path id="sig3" d="M374,152 L440,132 L506,138" stroke="#00d9a6" stroke-width="1.2" stroke-opacity="0.35" fill="none" />
    <path id="sig4" d="M374,118 L440,161 L506,138" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.30" fill="none" />

    <!-- Traveling Data-Signal Pulses -->
    <circle r="2.6" fill="#00d9a6" filter="url(#softGlow)">
      <animateMotion dur="2.6s" begin="0s" repeatCount="indefinite">
        <mpath href="#sig1" xlink:href="#sig1" />
      </animateMotion>
    </circle>
    <circle r="2.4" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion dur="3.1s" begin="0.7s" repeatCount="indefinite">
        <mpath href="#sig2" xlink:href="#sig2" />
      </animateMotion>
    </circle>
    <circle r="2.6" fill="#00d9a6" filter="url(#softGlow)">
      <animateMotion dur="2.8s" begin="1.3s" repeatCount="indefinite">
        <mpath href="#sig3" xlink:href="#sig3" />
      </animateMotion>
    </circle>
    <circle r="2.4" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion dur="3.4s" begin="1.9s" repeatCount="indefinite">
        <mpath href="#sig4" xlink:href="#sig4" />
      </animateMotion>
    </circle>

    <!-- Nodes: Input Layer -->
    <circle cx="374" cy="84"  r="4.5" fill="#131a27" stroke="#00d9a6" stroke-width="1.5">
      <animate attributeName="r" values="4.3;5.2;4.3" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="374" cy="118" r="4.5" fill="#131a27" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="4.3;5.2;4.3" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="374" cy="152" r="4.5" fill="#131a27" stroke="#00d9a6" stroke-width="1.5">
      <animate attributeName="r" values="4.3;5.2;4.3" dur="2.8s" begin="1.0s" repeatCount="indefinite" />
    </circle>

    <!-- Nodes: Hidden Layer -->
    <circle cx="440" cy="74"  r="4.5" fill="#162133" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="440" cy="103" r="4.5" fill="#162133" stroke="#00d9a6" stroke-width="1.5">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="440" cy="132" r="4.5" fill="#162133" stroke="#00d9a6" stroke-width="1.5">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="1.0s" repeatCount="indefinite" />
    </circle>
    <circle cx="440" cy="161" r="4.5" fill="#162133" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Nodes: Output Layer -->
    <circle cx="506" cy="98" r="5.2" fill="#0f141e" stroke="#00d9a6" stroke-width="1.8" filter="url(#softGlow)">
      <animate attributeName="r" values="4.8;5.8;4.8" dur="2.6s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="506" cy="138" r="5.2" fill="#0f141e" stroke="#38bdf8" stroke-width="1.8" filter="url(#softGlow)">
      <animate attributeName="r" values="4.8;5.8;4.8" dur="2.6s" begin="1.1s" repeatCount="indefinite" />
    </circle>

    <text x="525" y="185" text-anchor="end" class="nn-caption">neural pipeline · live</text>
  </g>
</svg>
