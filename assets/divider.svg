<svg width="560" height="8" viewBox="0 0 560 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d333b" stop-opacity="0" />
      <stop offset="15%" stop-color="#2d333b" stop-opacity="1" />
      <stop offset="85%" stop-color="#2d333b" stop-opacity="1" />
      <stop offset="100%" stop-color="#2d333b" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d9a6" stop-opacity="0" />
      <stop offset="35%" stop-color="#00d9a6" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="edgeFadeGrad" x1="0" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="12%" stop-color="#ffffff" />
      <stop offset="88%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <mask id="edgeFade">
      <rect x="0" y="0" width="560" height="8" fill="url(#edgeFadeGrad)" />
    </mask>
    <clipPath id="lineClip">
      <rect x="0" y="3.25" width="560" height="1.5" rx="0.75" />
    </clipPath>
  </defs>

  <line x1="0" y1="4" x2="560" y2="4" stroke="url(#baseGrad)" stroke-width="1.5" stroke-linecap="round" />

  <g mask="url(#edgeFade)">
    <g clip-path="url(#lineClip)">
      <rect x="-150" y="3" width="150" height="2" fill="url(#pulseGrad)">
        <animate attributeName="x" values="-150;560;-150" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>
    <rect x="-150" y="2" width="150" height="4" fill="url(#pulseGrad)" opacity="0.35">
      <animate attributeName="x" values="-150;560;-150" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
